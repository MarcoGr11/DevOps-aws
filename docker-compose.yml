services:
  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:4.9.2}
    container_name: localstack
    ports:
      - "127.0.0.1:4566:4566"
    env_file:
      - path: .env
        required: false
    environment:
      - SERVICES=lambda,apigateway,dynamodb,logs,iam,sts,cloudwatch
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30
