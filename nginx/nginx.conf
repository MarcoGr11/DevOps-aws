# Балансувальник лаби 9: round-robin між трьома екземплярами bookings-app.
worker_processes 1;                       # для демо достатньо одного воркера

events {
    worker_connections 256;               # макс. одночасних з'єднань на воркер
}

http {
    # у журналі видно, який бекенд обробив запит і скільки це тривало
    log_format lb '$remote_addr "$request" $status upstream=$upstream_addr '
                  'upstream_status=$upstream_status instance=$upstream_http_x_instance_id '
                  'rt=$request_time';
    access_log /dev/stdout lb;

    upstream bookings_backend {
        # алгоритм за замовчуванням — round-robin (по черзі)
        # max_fails=2 fail_timeout=5s: 2 невдалі спроби за 5 с -> сервер виключено на 5 с,
        # потім nginx знову пробує його реальним запитом (пасивна перевірка здоров'я:
        # open-source nginx не опитує бекенди сам).
        # Імена app1..app3 задані в /etc/hosts контейнера nginx (extra_hosts у compose) з
        # фіксованими IP, тому вони резолвляться навіть коли екземпляр зупинено.
        server app1:8000 max_fails=2 fail_timeout=5s;
        server app2:8000 max_fails=2 fail_timeout=5s;
        server app3:8000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        # перевірка живості самого балансувальника (без звернення до бекендів)
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://bookings_backend;          # запит іде в upstream-групу

            proxy_set_header Host $host;                 # оригінальний Host клієнта
            proxy_set_header X-Real-IP $remote_addr;     # IP клієнта для бекенда
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # X-Instance-Id від бекенда nginx передає клієнту як є (за замовчуванням)

            proxy_connect_timeout 1s;     # не чекати довго на з'єднання з мертвим екземпляром
            proxy_send_timeout 5s;        # таймаут передачі запиту бекенду
            proxy_read_timeout 5s;        # таймаут очікування відповіді бекенда

            # при помилці з'єднання, таймауті або 502/503/504 — спробувати наступний сервер;
            # POST повторюється лише якщо запит ще не був відправлений бекенду
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;      # не більше 3 спроб (= кількість екземплярів)
            proxy_next_upstream_timeout 5s;   # і не довше 5 с сумарно
        }
    }
}
