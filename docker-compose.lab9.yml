# Лаба 9: три екземпляри застосунку за балансувальником nginx.
# Окремий файл і окремий проєкт (name), щоб не зачіпати docker-compose.yml лаби 8:
#   docker compose -f docker-compose.lab9.yml up -d --build --wait
name: devops-lab9

x-app: &app
  build:
    context: .                      # корінь репо: Dockerfile бере lambda/handler.py
    dockerfile: app/Dockerfile
  image: bookings-app:lab9
  environment: &app-env
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test         # фейкові ключі LocalStack
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: us-east-1
    TABLE_NAME: bookings
  depends_on:
    init-table:
      condition: service_completed_successfully

services:
  localstack:
    image: localstack/localstack:4.9.2
    environment:
      - SERVICES=dynamodb           # лабі 9 потрібна лише DynamoDB
      - AWS_DEFAULT_REGION=us-east-1
    # порт на хост не публікується: бекенди ходять сюди по мережі compose,
    # тому стек може працювати паралельно з LocalStack лаби 8 (:4566)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  init-table:                       # одноразово створює таблицю (ідемпотентно) і завершується
    <<: *app
    command: ["python", "init_table.py"]
    depends_on:
      localstack:
        condition: service_healthy

  app1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: instance-1 }
    networks: { default: { ipv4_address: 172.30.9.11 } }
  app2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: instance-2 }
    networks: { default: { ipv4_address: 172.30.9.12 } }
  app3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: instance-3 }
    networks: { default: { ipv4_address: 172.30.9.13 } }

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # статичні записи замість DNS Docker: ім'я зупиненого екземпляра з DNS зникає,
    # а nginx має й далі знати його адресу, щоб пасивно перевіряти і повернути в пул
    extra_hosts:
      - "app1:172.30.9.11"
      - "app2:172.30.9.12"
      - "app3:172.30.9.13"
    depends_on:                     # балансувальник стартує лише після здорових бекендів
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
      app3: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 2s
      retries: 3

  # Для порівняння "без балансування": один екземпляр напряму на :8081 (профіль nolb)
  app-single:
    <<: *app
    profiles: ["nolb"]
    environment: { <<: *app-env, INSTANCE_ID: instance-single }
    ports:
      - "127.0.0.1:8081:8000"

networks:
  default:                          # фіксована підмережа, щоб задати бекендам статичні IP
    ipam:
      config:
        - subnet: 172.30.9.0/24
          ip_range: 172.30.9.128/25 # динамічні адреси — з верхньої половини, статичні .11-.13 вільні
